services:
  webots-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    gpus: all
    ipc: host
    shm_size: 4g
    ulimits:
      memlock: -1
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ..:/workspace
      - webots-config:/home/user/.config/Cyberbotics
      - webots-cache:/home/user/.cache/Cyberbotics
      - webots-share:/home/user/.local/share/Cyberbotics
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    command: /bin/bash

volumes:
  webots-config:
  webots-cache:
  webots-share:
